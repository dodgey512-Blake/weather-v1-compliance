<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2380" viewBox="0 0 1600 2380" role="img" aria-labelledby="title desc"><title id="title">Weather VIS 2.0 Compliance / 天气合规状态板</title><desc id="desc">八组中英状态组件，说明定位、数据源资格、缓存时效、AQI缺失、通知、导出清除、报价意向和官方警报。全部为组件说明，不是实时天气。</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#72bce8" stroke-opacity=".05"/></pattern></defs><style>text{font-family:"Avenir Next","PingFang SC","Noto Sans CJK SC",sans-serif}a:focus-visible{outline:3px solid #72bce8;outline-offset:5px}.signal{animation:breathe 2.6s ease-in-out infinite}.reduced-motion .signal{animation:none}@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style><rect width="1600" height="2380" fill="#091019"/><rect width="1600" height="2380" fill="url(#grid)"/><text x="44" y="57" font-size="18" fill="#72bce8" font-weight="650">WEATHER / VIS 2.0 / COMPLIANCE EDITION</text><text x="44" y="119" font-size="42" fill="#f4f0e6" font-weight="650">天气有依据，操作有选择。</text><text x="44" y="165" font-size="28" fill="#a0b2be" font-weight="500">Evidence, choice and honest availability.</text><text x="44" y="207" font-size="20" fill="#72bce8" font-weight="500">组件规范示例 / Component specimens · 2026-11-07 · No live weather values</text><g transform="translate(44 245)"><rect width="734" height="475" rx="24" fill="#111b25" stroke="#72bce8" stroke-opacity=".2"/><circle cx="679" cy="35" r="5" class="signal" fill="#72bce8"/><text x="32" y="42" font-size="16" fill="#72bce8" font-weight="650">01 / COMPLIANCE STATE</text><text x="32" y="91" font-size="28" fill="#f4f0e6" font-weight="650">定位由本人选择</text><text x="32" y="126" font-size="21" fill="#72bce8" font-weight="500">Location is optional</text><text x="32" y="181" font-size="23" fill="#f4f0e6" font-weight="500">先说明用途、接收者与约0.01度的精度。</text><text x="32" y="215" font-size="23" fill="#f4f0e6" font-weight="500">确认后才请求系统定位，手动城市始终可达。</text><text x="32" y="249" font-size="23" fill="#f4f0e6" font-weight="500">近似位置仍属个人数据，预警为区域参考。</text><text x="32" y="302" font-size="20" fill="#a0b2be" font-weight="500">Explain purpose and NOAA/NWS before requesting.</text><text x="32" y="332" font-size="20" fill="#a0b2be" font-weight="500">Use an approximate area or choose a city manually.</text><a href="../#/location" target="_top" aria-label="选择粗略定位 / Use approximate area"><rect x="32" y="378" width="326" height="68" rx="16" fill="#091019" stroke="#a0b2be" stroke-opacity=".35"/><text x="49" y="405" font-size="21" fill="#f4f0e6" font-weight="650">选择粗略定位</text><text x="49" y="429" font-size="17" fill="#f4f0e6" font-weight="500">Use approximate area</text></a><a href="../#/location" target="_top" aria-label="手动选择城市 / Choose a city"><rect x="376" y="378" width="326" height="68" rx="16" fill="#091019" stroke="#a0b2be" stroke-opacity=".35"/><text x="393" y="405" font-size="21" fill="#f4f0e6" font-weight="650">手动选择城市</text><text x="393" y="429" font-size="17" fill="#f4f0e6" font-weight="500">Choose a city</text></a></g><g transform="translate(822 245)"><rect width="734" height="475" rx="24" fill="#111b25" stroke="#72bce8" stroke-opacity=".2"/><circle cx="679" cy="35" r="5" class="signal" fill="#72bce8"/><text x="32" y="42" font-size="16" fill="#72bce8" font-weight="650">02 / COMPLIANCE STATE</text><text x="32" y="91" font-size="28" fill="#f4f0e6" font-weight="650">来源与服务资格</text><text x="32" y="126" font-size="21" fill="#72bce8" font-weight="500">Source and service access</text><text x="32" y="181" font-size="23" fill="#f4f0e6" font-weight="500">NWS提供天气、观测和官方警报。</text><text x="32" y="215" font-size="23" fill="#f4f0e6" font-weight="500">预置城市仅Austin、New York、Seattle、Denver。</text><text x="32" y="249" font-size="23" fill="#f4f0e6" font-weight="500">商用资格未确认的免费API不发送请求。</text><text x="32" y="302" font-size="20" fill="#a0b2be" font-weight="500">Live path uses NWS; search covers four presets.</text><text x="32" y="332" font-size="20" fill="#a0b2be" font-weight="500">Commercial geocoding and AQI remain disconnected.</text><a href="../#/sources" target="_top" aria-label="查看数据来源 / Review sources"><rect x="32" y="378" width="326" height="68" rx="16" fill="#091019" stroke="#a0b2be" stroke-opacity=".35"/><text x="49" y="405" font-size="21" fill="#f4f0e6" font-weight="650">查看数据来源</text><text x="49" y="429" font-size="17" fill="#f4f0e6" font-weight="500">Review sources</text></a><a href="https://www.weather.gov/documentation/services-web-api" target="_top" aria-label="NWS公开说明 / NWS API information"><rect x="376" y="378" width="326" height="68" rx="16" fill="#091019" stroke="#a0b2be" stroke-opacity=".35"/><text x="393" y="405" font-size="21" fill="#f4f0e6" font-weight="650">NWS公开说明</text><text x="393" y="429" font-size="17" fill="#f4f0e6" font-weight="500">NWS API information</text></a></g><g transform="translate(44 750)"><rect width="734" height="475" rx="24" fill="#111b25" stroke="#72bce8" stroke-opacity=".2"/><circle cx="679" cy="35" r="5" class="signal" fill="#72bce8"/><text x="32" y="42" font-size="16" fill="#72bce8" font-weight="650">03 / COMPLIANCE STATE</text><text x="32" y="91" font-size="28" fill="#f4f0e6" font-weight="650">时效是每个来源的状态</text><text x="32" y="126" font-size="21" fill="#72bce8" font-weight="500">Every source expires independently</text><text x="32" y="181" font-size="23" fill="#f4f0e6" font-weight="500">发布、观测、获取、缓存时间分别表达。</text><text x="32" y="215" font-size="23" fill="#f4f0e6" font-weight="500">刚刚获取旧数据，不会续成新观测。</text><text x="32" y="249" font-size="23" fill="#f4f0e6" font-weight="500">预报或警报源过期，暂停确定性判断。</text><text x="32" y="302" font-size="20" fill="#a0b2be" font-weight="500">Issued, observed and fetched times stay separate.</text><text x="32" y="332" font-size="20" fill="#a0b2be" font-weight="500">A new request does not make old data current.</text><a href="../#/sources" target="_top" aria-label="已缓存 · 保留原始时间 / Cached · original timestamps"><rect x="32" y="378" width="326" height="68" rx="16" fill="#091019" stroke="#a0b2be" stroke-opacity=".35"/><text x="49" y="405" font-size="21" fill="#f4f0e6" font-weight="650">已缓存 · 保留原始时间</text><text x="49" y="429" font-size="17" fill="#f4f0e6" font-weight="500">Cached · original timestamps</text></a><a href="../#/sources" target="_top" aria-label="重新获取 / Refresh in product"><rect x="376" y="378" width="326" height="68" rx="16" fill="#091019" stroke="#a0b2be" stroke-opacity=".35"/><text x="393" y="405" font-size="21" fill="#f4f0e6" font-weight="650">重新获取</text><text x="393" y="429" font-size="17" fill="#f4f0e6" font-weight="500">Refresh in product</text></a></g><g transform="translate(822 750)"><rect width="734" height="475" rx="24" fill="#111b25" stroke="#72bce8" stroke-opacity=".2"/><circle cx="679" cy="35" r="5" class="signal" fill="#ff765f"/><text x="32" y="42" font-size="16" fill="#ff765f" font-weight="650">04 / COMPLIANCE STATE</text><text x="32" y="91" font-size="28" fill="#f4f0e6" font-weight="650">AQI缺失时保留不确定性</text><text x="32" y="126" font-size="21" fill="#72bce8" font-weight="500">Missing AQI keeps the decision incomplete</text><text x="32" y="181" font-size="23" fill="#f4f0e6" font-weight="500">空气质量当前未接入授权来源，显示缺失。</text><text x="32" y="215" font-size="23" fill="#f4f0e6" font-weight="500">没有完整环境证据，不开放应用改期。</text><text x="32" y="249" font-size="23" fill="#f4f0e6" font-weight="500">已知严重天气仍保留更保守的风险提示。</text><text x="32" y="302" font-size="20" fill="#a0b2be" font-weight="500">AQI is unavailable, never a fabricated zero.</text><text x="32" y="332" font-size="20" fill="#a0b2be" font-weight="500">No applicable move is offered from weather alone.</text><a href="../#/plan" target="_top" aria-label="需关注 · 暂不应用 / Review · cannot apply"><rect x="32" y="378" width="326" height="68" rx="16" fill="#091019" stroke="#a0b2be" stroke-opacity=".35"/><text x="49" y="405" font-size="21" fill="#f4f0e6" font-weight="650">需关注 · 暂不应用</text><text x="49" y="429" font-size="17" fill="#f4f0e6" font-weight="500">Review · cannot apply</text></a><a href="../#/sources" target="_top" aria-label="查看缺失原因 / Review missing data"><rect x="376" y="378" width="326" height="68" rx="16" fill="#091019" stroke="#a0b2be" stroke-opacity=".35"/><text x="393" y="405" font-size="21" fill="#f4f0e6" font-weight="650">查看缺失原因</text><text x="393" y="429" font-size="17" fill="#f4f0e6" font-weight="500">Review missing data</text></a></g><g transform="translate(44 1255)"><rect width="734" height="475" rx="24" fill="#111b25" stroke="#72bce8" stroke-opacity=".2"/><circle cx="679" cy="35" r="5" class="signal" fill="#72bce8"/><text x="32" y="42" font-size="16" fill="#72bce8" font-weight="650">05 / COMPLIANCE STATE</text><text x="32" y="91" font-size="28" fill="#f4f0e6" font-weight="650">通知权限与监测能力分别说明</text><text x="32" y="126" font-size="21" fill="#72bce8" font-weight="500">Permission does not create monitoring</text><text x="32" y="181" font-size="23" fill="#f4f0e6" font-weight="500">仅在应用可运行时检查天气变化。</text><text x="32" y="215" font-size="23" fill="#f4f0e6" font-weight="500">允许通知不等于关闭应用后持续监测。</text><text x="32" y="249" font-size="23" fill="#f4f0e6" font-weight="500">关闭通知后仍保留应用内消息和设置。</text><text x="32" y="302" font-size="20" fill="#a0b2be" font-weight="500">Changes are checked only while the app can run.</text><text x="32" y="332" font-size="20" fill="#a0b2be" font-weight="500">Notifications can be switched off in settings.</text><a href="../#/settings" target="_top" aria-label="按需开启通知 / Enable when needed"><rect x="32" y="378" width="326" height="68" rx="16" fill="#091019" stroke="#a0b2be" stroke-opacity=".35"/><text x="49" y="405" font-size="21" fill="#f4f0e6" font-weight="650">按需开启通知</text><text x="49" y="429" font-size="17" fill="#f4f0e6" font-weight="500">Enable when needed</text></a><a href="../#/inbox" target="_top" aria-label="继续使用应用内消息 / Use in-app messages"><rect x="376" y="378" width="326" height="68" rx="16" fill="#091019" stroke="#a0b2be" stroke-opacity=".35"/><text x="393" y="405" font-size="21" fill="#f4f0e6" font-weight="650">继续使用应用内消息</text><text x="393" y="429" font-size="17" fill="#f4f0e6" font-weight="500">Use in-app messages</text></a></g><g transform="translate(822 1255)"><rect width="734" height="475" rx="24" fill="#111b25" stroke="#72bce8" stroke-opacity=".2"/><circle cx="679" cy="35" r="5" class="signal" fill="#72bce8"/><text x="32" y="42" font-size="16" fill="#72bce8" font-weight="650">06 / COMPLIANCE STATE</text><text x="32" y="91" font-size="28" fill="#f4f0e6" font-weight="650">导出与清除有明确范围</text><text x="32" y="126" font-size="21" fill="#72bce8" font-weight="500">Export and deletion show their scope</text><text x="32" y="181" font-size="23" fill="#f4f0e6" font-weight="500">默认导出移除坐标、天气快照与自由备注。</text><text x="32" y="215" font-size="23" fill="#f4f0e6" font-weight="500">导出前可检查文件，其他字段仍可能敏感。</text><text x="32" y="249" font-size="23" fill="#f4f0e6" font-weight="500">确认清除只处理此独立版本本地资料。</text><text x="32" y="302" font-size="20" fill="#a0b2be" font-weight="500">Default export removes coordinates and notes.</text><text x="32" y="332" font-size="20" fill="#a0b2be" font-weight="500">Review the file; other fields may still be sensitive.</text><a href="../#/settings" target="_top" aria-label="检查导出内容 / Review export"><rect x="32" y="378" width="326" height="68" rx="16" fill="#091019" stroke="#a0b2be" stroke-opacity=".35"/><text x="49" y="405" font-size="21" fill="#f4f0e6" font-weight="650">检查导出内容</text><text x="49" y="429" font-size="17" fill="#f4f0e6" font-weight="500">Review export</text></a><a href="../#/settings" target="_top" aria-label="确认清除此版本 / Confirm local deletion"><rect x="376" y="378" width="326" height="68" rx="16" fill="#091019" stroke="#a0b2be" stroke-opacity=".35"/><text x="393" y="405" font-size="21" fill="#f4f0e6" font-weight="650">确认清除此版本</text><text x="393" y="429" font-size="17" fill="#f4f0e6" font-weight="500">Confirm local deletion</text></a></g><g transform="translate(44 1760)"><rect width="734" height="475" rx="24" fill="#111b25" stroke="#72bce8" stroke-opacity=".2"/><circle cx="679" cy="35" r="5" class="signal" fill="#ddfc68"/><text x="32" y="42" font-size="16" fill="#ddfc68" font-weight="650">07 / COMPLIANCE STATE</text><text x="32" y="91" font-size="28" fill="#f4f0e6" font-weight="650">报价意向与真实购买分开</text><text x="32" y="126" font-size="21" fill="#72bce8" font-weight="500">Price interest is not a purchase</text><text x="32" y="181" font-size="23" fill="#f4f0e6" font-weight="500">本版仅记录自愿报价意向，不收费。</text><text x="32" y="215" font-size="23" fill="#f4f0e6" font-weight="500">选择意向不创建订单、试用或订阅权益。</text><text x="32" y="249" font-size="23" fill="#f4f0e6" font-weight="500">正式商店价格、恢复与退款另行接入。</text><text x="32" y="302" font-size="20" fill="#a0b2be" font-weight="500">Voluntary pricing interest creates no transaction.</text><text x="32" y="332" font-size="20" fill="#a0b2be" font-weight="500">Store billing, restore and refunds are release gates.</text><a href="../#/pricing" target="_top" aria-label="记录报价意向 / Record interest"><rect x="32" y="378" width="326" height="68" rx="16" fill="#ddfc68" stroke="#a0b2be" stroke-opacity=".35"/><text x="49" y="405" font-size="21" fill="#091019" font-weight="650">记录报价意向</text><text x="49" y="429" font-size="17" fill="#091019" font-weight="500">Record interest</text></a><a href="../#/today" target="_top" aria-label="继续免费使用 / Continue free"><rect x="376" y="378" width="326" height="68" rx="16" fill="#091019" stroke="#a0b2be" stroke-opacity=".35"/><text x="393" y="405" font-size="21" fill="#f4f0e6" font-weight="650">继续免费使用</text><text x="393" y="429" font-size="17" fill="#f4f0e6" font-weight="500">Continue free</text></a></g><g transform="translate(822 1760)"><rect width="734" height="475" rx="24" fill="#111b25" stroke="#72bce8" stroke-opacity=".2"/><circle cx="679" cy="35" r="5" class="signal" fill="#ff765f"/><text x="32" y="42" font-size="16" fill="#ff765f" font-weight="650">08 / COMPLIANCE STATE</text><text x="32" y="91" font-size="28" fill="#f4f0e6" font-weight="650">警报原文与应用判断分开</text><text x="32" y="126" font-size="21" fill="#72bce8" font-weight="500">Official warnings and app rules stay distinct</text><text x="32" y="181" font-size="23" fill="#f4f0e6" font-weight="500">官方原文保留来源、有效期与语言。</text><text x="32" y="215" font-size="23" fill="#f4f0e6" font-weight="500">应用实验阈值不包装成NWS官方跑步建议。</text><text x="32" y="249" font-size="23" fill="#f4f0e6" font-weight="500">天气与定位可缺失，不作安全或救援保证。</text><text x="32" y="302" font-size="20" fill="#a0b2be" font-weight="500">Keep official content and validity unchanged.</text><text x="32" y="332" font-size="20" fill="#a0b2be" font-weight="500">App rules do not imply NOAA/NWS endorsement.</text><a href="https://www.weather.gov/alerts" target="_top" aria-label="查看官方渠道 / Official weather alerts"><rect x="32" y="378" width="326" height="68" rx="16" fill="#091019" stroke="#a0b2be" stroke-opacity=".35"/><text x="49" y="405" font-size="21" fill="#f4f0e6" font-weight="650">查看官方渠道</text><text x="49" y="429" font-size="17" fill="#f4f0e6" font-weight="500">Official weather alerts</text></a><a href="../terms.html" target="_top" aria-label="查看应用条款 / Application terms"><rect x="376" y="378" width="326" height="68" rx="16" fill="#091019" stroke="#a0b2be" stroke-opacity=".35"/><text x="393" y="405" font-size="21" fill="#f4f0e6" font-weight="650">查看应用条款</text><text x="393" y="429" font-size="17" fill="#f4f0e6" font-weight="500">Application terms</text></a></g><text x="44" y="2313" font-size="21" fill="#a0b2be" font-weight="500">每项状态必须对应实际能力。正式服务、权限、数据声明和真机验收仍需实际完成。</text><text x="44" y="2348" font-size="20" fill="#72bce8" font-weight="500">Match states to actual behavior. Validate connected services and devices before store release.</text></svg>